name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Repository hygiene (no data, weights, secrets or notebook outputs)
        run: python tools/check_repo.py
      - name: Tests
        run: pytest -q
