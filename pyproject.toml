[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepguard"
version = "2.0.0.dev0"
description = "DeepGuard v2: deepfake and AI-generated media detector (shared preprocessing and inference package)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "av>=12",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5", "scikit-image>=0.21"]
mediapipe = ["mediapipe>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
